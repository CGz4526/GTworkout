name: workout
services:
  web:
    image: workout-web:p3
    build:
      context: ..
      dockerfile: infra/docker/web.Dockerfile
    ports:
      - "127.0.0.1:8088:80"
    restart: unless-stopped
    mem_limit: 128m
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/healthz"]
      interval: 15s
      timeout: 3s
      retries: 3
  server:
    image: workout-server:p3
    build:
      context: ..
      dockerfile: infra/docker/server.Dockerfile
    environment:
      WORKOUT_DB_URL: jdbc:postgresql://db:5432/workout
      WORKOUT_TRAINING_WRITE_ENABLED: ${WORKOUT_TRAINING_WRITE_ENABLED:-false}
      WORKOUT_DB_USER: workout
      WORKOUT_DB_PASSWORD: ${WORKOUT_DB_PASSWORD:?Run infra/start-local.ps1 or inject WORKOUT_DB_PASSWORD}
      WORKOUT_REGISTRATION_ENABLED: ${WORKOUT_REGISTRATION_ENABLED:-false}
      WORKOUT_COOKIE_SECURE: ${WORKOUT_COOKIE_SECURE:-false}
      WORKOUT_DEEPSEEK_API_KEY: ${WORKOUT_DEEPSEEK_API_KEY:-}
      WORKOUT_DEEPSEEK_MODEL: ${WORKOUT_DEEPSEEK_MODEL:-}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/actuator/health/readiness"]
      interval: 15s
      timeout: 3s
      start_period: 40s
      retries: 3
  db:
    image: postgres:17.6-alpine@sha256:ef257d85f76e48da1c64832459b59fcaba1a4dac97bf5d7450c77753542eee94
    environment:
      POSTGRES_DB: workout
      POSTGRES_USER: workout
      POSTGRES_PASSWORD: ${WORKOUT_DB_PASSWORD:?Run infra/start-local.ps1 or inject WORKOUT_DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    mem_limit: 256m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U workout -d workout"]
      interval: 10s
      timeout: 3s
      retries: 5
volumes:
  postgres_data:
